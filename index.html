<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Advanced Search
        </title>

        <img src="google.png" alt="Google" style="width: 25mm;height: 25mm;">
        <hr>

        <style>
            body{
                color: #4d5156;
                font-family: Arial, sans-serif;
                margin: 80px;
                border-width: 0px;
            }

            h1{
                font-size: 20px;
                text-align: right;
                position: absolute;
                right: 10px;
                top: 1px;
            }

            h2{
                font-size: 30px;
                text-align: left;
                font-weight: 100;
            }

            h3{
                font-size: 23px;
                padding-top: 25px;
                font-weight: 100;
            }

            .find{
                display: grid;
                grid-template-columns: 200px 1fr;
                gap: 15px 10px;
                align-items: center;
            }

            input[type="text"].fields{
                font-size: 15px;
                width: 200px;
                height: 50px;
                margin: 10px;
                padding: 10px;
                border-radius: 5px;
                border-width: 0.5px;
            }

            input[type="submit"]{
                background-color: rgb(11, 87, 208);
                border: 0;
                color: white;
                width: 140px;
                font-size: 14px;
                text-align: center;
                border-radius: 22px;
                padding: 12px;
                grid-column: 2;
                margin-left: 70px;
            }

        </style>
    </head>
    <body>
        <h1><a href="https://www.google.com">Google Search</a></h1>
        <h2>Advanced Search</h2>
        <h3>Find pages with</h3>

        <form class="find" action="https://www.google.com/search?">
            <label for="all">All of these words:</label>
            <input type="text" name="as_q" class="fields">

            <label for="exact">This exact word or phrase:</label>
            <input type="text" name="as_epq" class="fields">
            
            <label for="any">Any of these words:</label>
            <input type="text" name="as_oq" class="fields">

            <label for="none">None of these words:</label>
            <input type="text" name="as_eq" class="fields">

            <input type="submit" value="Advanced Search">

        </form>
    </body>
</html>
